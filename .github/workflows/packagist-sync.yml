name: Sync to Packagist

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  update-packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        uses: mnavarrocarter/packagist-update@v1.0
        with:
          username: "AL-Hareth"
          api_token: ${{ secrets.PACKAGIST_TOKEN }}
